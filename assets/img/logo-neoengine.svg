<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NeoEngine">
  <defs>
    <linearGradient id="neoCyanTrace" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15d4f5" />
      <stop offset="50%" stop-color="#1ee6ff" />
      <stop offset="100%" stop-color="#27ecff" />
    </linearGradient>
    <filter id="neoSoftGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo antracita oscuro del diseño original -->
  <rect width="512" height="512" rx="96" fill="#171a1e" />

  <g filter="url(#neoSoftGlow)" stroke="url(#neoCyanTrace)" stroke-width="14.5" fill="none">
    <!-- Pista 1 (Superior / Izquierda exterior -> Arco superior -> Vértice interno -> Nodo superior interno) -->
    <path d="M 118.5 334 L 201 169 A 30.1 30.1 0 0 1 255 169 L 293 245 L 323.5 184"
          stroke-linecap="round"
          stroke-linejoin="miter"
          stroke-miterlimit="6" />

    <!-- Pista 2 (Central con extremos redondeados y vértices en punta) -->
    <path d="M 166 306 L 228 182 L 293 312 L 352 194"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Pista 3 (Inferior / Izquierda interior -> Vértice interno -> Arco inferior -> Nodo superior derecho exterior) -->
    <path d="M 192.5 320 L 228 249 L 266 325 A 30.1 30.1 0 0 0 320 325 L 395.5 174"
          stroke-linecap="round"
          stroke-linejoin="miter"
          stroke-miterlimit="6" />

    <!-- 4 Nodos / Pads de vía PCB (Anillos circulares) -->
    <circle cx="113" cy="345" r="10.5" fill="#171a1e" stroke-width="10.5" />
    <circle cx="187" cy="331" r="10.5" fill="#171a1e" stroke-width="10.5" />
    <circle cx="329" cy="173" r="10.5" fill="#171a1e" stroke-width="10.5" />
    <circle cx="401" cy="163" r="10.5" fill="#171a1e" stroke-width="10.5" />
  </g>
</svg>
